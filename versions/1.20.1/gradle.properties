# Minecraft 1.20.1: everything that differs between Minecraft versions, read by all modules below this folder
# (settings.gradle hands these properties to them; see build-logic/ for what the modules do with them)
minecraft_version=1.20.1
java_version=17
# Minecraft is obfuscated: Fabric Loom with Mojang's names in dev and a remapped jar
fabric_loom_remap=true
# Fabric's access widener in common/src/main/resources (Forge/NeoForge use their access transformer)
access_widener=mcpj.accesswidener
# folders of shared/ compiled into the modules of this version (common, NeoForge or Forge, Fabric)
shared_mc=mc/all,mc/1.20.1-1.21.1
shared_fabric=fabric/all,fabric/1.20.1-1.21.1

# Forge 47
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
forge_version_range=[47,)
loader_version_range=[47,)
# client mods for the Forge dev client (Modrinth maven)
embeddium_version=0.3.31+mc1.20.1
oculus_version=1.20.1-1.8.0

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.92.6+1.20.1
team_reborn_energy_version=3.0.0
