# Minecraft 26.3: everything that differs between Minecraft versions, read by all modules below this folder
# (settings.gradle hands these properties to them; see build-logic/ for what the modules do with them)
minecraft_version=26.3
java_version=25
# Minecraft is unobfuscated: Fabric Loom without mappings and without remapping
fabric_loom_remap=false
# Fabric's class tweaker in common/src/main/resources (NeoForge uses its access transformer)
access_widener=mcpj.classtweaker
# folders of shared/ compiled into the modules of this version (common, NeoForge, Fabric)
shared_mc=mc/all,mc/1.21.1-26.3
shared_neoforge=neoforge/all
shared_fabric=fabric/all,fabric/1.21.1-26.3

# NeoForge
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.101
neo_version_range=[26.3,)
loader_version_range=[1,)

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3
