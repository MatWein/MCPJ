pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    // downloads missing Java toolchains (1.20.1 modules compile for Java 17, 26.x for Java 25)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'mcpj'

// core: the game logic without any Minecraft or mod loader API (plain Java)
include 'core'
// one module per Minecraft version and mod loader, each builds its own mod jar
// Minecraft 1.20.1: vanilla code shared by both loaders, then one module per loader
include 'mc_1.20.1_common'
include 'mc_1.20.1_forge_47'
include 'mc_1.20.1_fabric'
// Minecraft 26.3 (unobfuscated, Java 25): vanilla code shared by both loaders, then one module per loader
include 'mc_26.3_common'
include 'mc_26.3_fabric'
