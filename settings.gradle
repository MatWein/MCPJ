pluginManagement {
    // the convention plugins (mcpj.vanilla, mcpj.neoforge, mcpj.forge, mcpj.fabric); they also bring the loader plugins
    includeBuild 'build-logic'
    repositories {
        gradlePluginPortal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

plugins {
    // downloads missing Java toolchains (1.20.1 modules compile for Java 17, 26.x for Java 25)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
rootProject.name = 'mcpj'

// core: the game logic without any Minecraft or mod loader API (plain Java)
include 'core'

// One folder per Minecraft version below versions/: its gradle.properties holds everything that differs between
// versions, each subfolder with a build.gradle is a module. "common" is the vanilla code shared by the loaders of
// that version, the others build one mod jar each. Module names: mc_<version>_<folder>, e.g. :mc_26.3_neoforge.
def minecraftVersions = ['1.20.1', '1.21.1', '26.3']

def versionProperties = [:]
minecraftVersions.each { minecraftVersion ->
    def versionDir = file("versions/${minecraftVersion}")
    def properties = new Properties()
    new File(versionDir, 'gradle.properties').withInputStream { properties.load(it) }
    versionDir.listFiles().findAll { new File(it, 'build.gradle').isFile() }.sort().each { moduleDir ->
        def name = "mc_${minecraftVersion}_${moduleDir.name}"
        include name
        project(":${name}").projectDir = moduleDir
        versionProperties[name] = properties
    }
}

// the version's properties are available in every module of that version like its own gradle.properties
gradle.beforeProject { project ->
    versionProperties[project.name]?.each { key, value -> project.ext.set(key, value) }
}
