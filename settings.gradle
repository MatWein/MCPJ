pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
    }
}

// The foojay plugin (Java downloads) brings Gson 2.9, which would also be used by Fabric Loom and cannot handle
// records; settings plugins are loaded first, so raise Gson here.
buildscript {
    dependencies {
        classpath 'com.google.code.gson:gson:2.10.1'
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}
rootProject.name = 'mcpj'

// core: the game logic without any Minecraft or mod loader API (plain Java)
include 'core'
// one module per Minecraft version and mod loader, each builds its own mod jar
// Minecraft 1.20.1: vanilla code shared by both loaders, then one module per loader
include 'mc_1.20.1_common'
include 'mc_1.20.1_forge_47'
include 'mc_1.20.1_fabric'
