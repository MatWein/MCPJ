plugins {
    // only to compile against vanilla Minecraft 26.3 (unobfuscated, no mappings, no mod loader)
    id 'net.fabricmc.fabric-loom'
}

// Vanilla Minecraft 26.3 code shared by the NeoForge and Fabric modules. The loader modules compile these
// sources themselves (against their own Minecraft), so this module never ships as a jar of its own.

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

loom {
    accessWidenerPath = file('src/main/resources/mcpj.classtweaker')
}


dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation project(':core')
    // only for the annotation types Loom adds to Minecraft's classes; nothing of the loader is used here
    compileOnly "net.fabricmc:fabric-loader:0.20.1"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
tasks.named('compileJava', JavaCompile).configure { options.compilerArgs += ['-Xmaxerrs', '2000'] }

// One test instance per entry of McpjGameTests (test("name", maxTicks, ...)): data/mcpj/test_instance/<name>.json.
// The list in Java is the only place for test names and time limits.
def testInstances = layout.buildDirectory.dir('generated/testInstances')
def testList = rootProject.file('shared/mc_all/java/de/mcpj/mc/gametest/McpjGameTests.java')
def generateTestInstances = tasks.register('generateTestInstances') {
    inputs.file(testList)
    outputs.dir(testInstances)
    doLast {
        def dir = testInstances.get().dir('data/mcpj/test_instance').asFile
        project.delete(dir)
        dir.mkdirs()
        (testList.text =~ /test\("([a-z0-9_]+)", (\d+),/).each { match, name, maxTicks ->
            new File(dir, "${name}.json").text = """{
  "type": "minecraft:function",
  "function": "mcpj:${name}",
  "environment": "minecraft:default",
  "structure": "mcpj:platform",
  "max_ticks": ${maxTicks}
}
"""
        }
    }
}
sourceSets.main.resources.srcDir(generateTestInstances)

// Minecraft code that compiles unchanged against every supported version (shared/mc_all) is part of this module;
// the loader modules take it along with the rest of this source set
sourceSets.main {
    java.srcDir(rootProject.file('shared/mc_all/java'))
    resources.srcDir(rootProject.file('shared/mc_all/resources'))
}

// code shared with other Minecraft versions or loaders (see shared/ and the README); compiled as part of this module
sourceSets.main.java {
    srcDir(rootProject.file('shared/mc_1.21.1-26.3/java'))
}
