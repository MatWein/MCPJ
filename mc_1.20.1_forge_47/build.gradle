plugins {
    id 'net.neoforged.moddev.legacyforge'
}

// the jar name tells which Minecraft version and loader it is for: mcpj-<version>+mc<mc version>-forge.jar
version = "${mod_version}+mc${minecraft_version}-forge"
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.1 runs on Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    // Mojang's names in dev; the jar is reobfuscated to SRG names (reobfJar)
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            // ./gradlew runClient -PjoinServer=localhost connects straight to a server
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer')
            }
        }
        // runs all game tests, then exits
        gameTestServer {
            type = 'gameTestServer'
            // separate directory so game tests always start from a fresh world (see below)
            gameDirectory = file('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // the core is part of the mod (same module layer), not a separate library
            sourceSet project(':core').sourceSets.main
        }
    }
}

repositories {
    // mods of the local test server (JSG, Mekanism, CC:Tweaked, ...), deobfuscated for the dev client
    flatDir {
        dir 'run-server/mods'
    }
    // Embeddium + Oculus (shaders) for the dev client
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

configurations {
    // client-only mods: they crash a dedicated or game test server, so they are not on the shared runtime classpath
    clientMods { transitive = false }
}
// remapped (deobfuscated) variant of clientMods: modClientMods
obfuscation.createRemappingConfiguration(configurations.clientMods)

dependencies {
    // @Nullable (type annotations, as Minecraft 26.x uses them); compile time only
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    // the game logic; its classes are packed into this mod's jar (see jar task)
    implementation project(':core')

    // The mod must work on its own: -Pstandalone runs without any other mod (e.g. ./gradlew runGameTestServer -Pstandalone)
    if (!project.hasProperty('standalone')) {
        // load every mod jar of the test server in the dev environment as well
        fileTree(dir: 'run-server/mods', include: '*.jar')
                .filter { !it.name.startsWith(mod_id) }
                .each {
                    def m = (it.name - '.jar') =~ /^(.+?)-(\d.*)$/
                    if (m.matches()) modRuntimeOnly "blank:${m.group(1)}:${m.group(2)}"
                }

        // client-only mods from Modrinth (shaders), deobfuscated like the server mods, loaded by runClient only
        modClientMods "maven.modrinth:embeddium:${embeddium_version}"
        modClientMods "maven.modrinth:oculus:${oculus_version}"
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    from(project(':core').sourceSets.main.output)
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// copy the deobfuscated client-only mods to run/mods; only the client loads them
def clientModsDir = file('run/mods')
def clientModFiles = configurations.named('modClientMods')
tasks.register('copyClientMods') {
    inputs.files(clientModFiles)
    doLast {
        clientModsDir.mkdirs()
        // remove previous copies (prefix "dev-") so removed or updated mods do not linger
        clientModsDir.listFiles().findAll { it.name.startsWith('dev-') }.each { it.delete() }
        clientModFiles.get().files.each { f ->
            java.nio.file.Files.copy(f.toPath(), new File(clientModsDir, 'dev-' + f.name).toPath())
        }
    }
}
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyClientMods' }

// game tests always run in a fresh world, otherwise hovering jumpers of earlier runs get in the way
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

// vanilla Minecraft 1.20.1 code shared between the loader modules, compiled here against this loader's Minecraft
def common = project(':mc_1.20.1_common')
tasks.named('compileJava', JavaCompile).configure {
    source(common.sourceSets.main.allSource)
}
tasks.named('processResources', ProcessResources).configure {
    from(common.sourceSets.main.resources)
}
