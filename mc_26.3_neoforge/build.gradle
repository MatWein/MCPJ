plugins {
    id 'net.neoforged.moddev'
}

// the jar name tells which Minecraft version and loader it is for: mcpj-<version>+mc<mc version>-neoforge.jar
version = "${mod_version}+mc${minecraft_version}-neoforge"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def common = project(':mc_26.3_common')

neoForge {
    version = neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            gameDirectory = file('run')
            // ./gradlew runClient -PjoinServer=localhost connects straight to a server
            if (project.hasProperty('joinServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.property('joinServer')
            }
        }
        server {
            server()
            gameDirectory = file('run-server')
            programArgument '--nogui'
        }
        // runs all game tests, then exits
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('run-gametest')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            // the core is part of the mod (same module layer), not a separate library
            sourceSet project(':core').sourceSets.main
        }
    }
}

dependencies {
    // the game logic; its classes are packed into this mod's jar (see jar task)
    implementation project(':core')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from(project(':core').sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

// game tests always run in a fresh world
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst { delete file('run-gametest/world') }
}

// vanilla Minecraft 26.3 code shared between the loader modules, compiled here against this loader's Minecraft
tasks.named('compileJava', JavaCompile).configure {
    source(common.sourceSets.main.allSource)
}
tasks.named('processResources', ProcessResources).configure {
    from(common.sourceSets.main.resources) {
        // Fabric's class tweaker; NeoForge uses the access transformer
        exclude 'mcpj.classtweaker'
    }
}
