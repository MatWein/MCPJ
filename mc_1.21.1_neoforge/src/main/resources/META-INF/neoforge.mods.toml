modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/MatWein/MCPJ/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
iconFile="mcpj_logo.png"
logoFile="mcpj_logo.png"
displayURL="https://github.com/MatWein/MCPJ"
credits="Developed entirely by AI (Claude by Anthropic)"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# vanilla mixins shared with Fabric (from mc_26.3_common)
[[mixins]]
config="mcpj.mixins.json"
