plugins {
    id 'java-library'
}

// The core is plain Java: no Minecraft, no mod loader. It targets the oldest Java any module needs
// (Minecraft 1.20.1: Java 17); newer Minecraft versions run it on newer JVMs.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

group = mod_group_id
version = mod_version

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
}
