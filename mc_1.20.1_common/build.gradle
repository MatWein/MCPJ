plugins {
    // only to compile against vanilla Minecraft 1.20.1 with Mojang's names (no mod loader)
    id 'net.fabricmc.fabric-loom-remap'
}

// Vanilla Minecraft 1.20.1 code shared by the Forge and Fabric modules: entities, blocks, rendering, HUD,
// input and network messages. The loader modules compile these sources themselves (against their own
// Minecraft), so this module never ships as a jar of its own.

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

loom {
    accessWidenerPath = file('src/main/resources/mcpj.accesswidener')
}

dependencies {
    // @Nullable (type annotations, as Minecraft 26.x uses them); compile time only
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    implementation project(':core')
    // only for the annotation types Loom adds to Minecraft's classes (otherwise javac warns about EnvType);
    // nothing of the loader is used here
    compileOnly "net.fabricmc:fabric-loader:0.16.14"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Minecraft code that compiles unchanged against every supported version (mc_core_common) is part of this module;
// the loader modules take it along with the rest of this source set
sourceSets.main {
    java.srcDir(rootProject.file('mc_core_common/src/main/java'))
    resources.srcDir(rootProject.file('mc_core_common/src/main/resources'))
}
