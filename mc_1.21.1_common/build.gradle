plugins {
    // only to compile against vanilla Minecraft 1.21.1 with Mojang's names (no mod loader)
    id 'net.fabricmc.fabric-loom-remap'
}

// Vanilla Minecraft 1.21.1 code shared by the NeoForge and Fabric modules. The loader modules compile these
// sources themselves (against their own Minecraft), so this module never ships as a jar of its own.

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

loom {
    accessWidenerPath = file('src/main/resources/mcpj.accesswidener')
}

dependencies {
    // @Nullable (type annotations, as Minecraft 26.x uses them); compile time only
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    implementation project(':core')
    // only for the annotation types Loom adds to Minecraft's classes; nothing of the loader is used here
    compileOnly "net.fabricmc:fabric-loader:0.20.1"
    // the shared mixins (both loaders apply them)
    compileOnly "net.fabricmc:sponge-mixin:0.17.5+mixin.0.8.7"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.named('compileJava', JavaCompile).configure { options.compilerArgs += ['-Xmaxerrs', '2000'] }

// Minecraft code that compiles unchanged against every supported version (mc_core_common) is part of this module;
// the loader modules take it along with the rest of this source set
sourceSets.main {
    java.srcDir(rootProject.file('mc_core_common/src/main/java'))
    resources.srcDir(rootProject.file('mc_core_common/src/main/resources'))
}
